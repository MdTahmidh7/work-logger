<header class="header">
  <div class="header-left">
    <div class="brand">
      <div class="brand-icon">
        <mat-icon>schedule</mat-icon>
      </div>
      <div class="brand-text">
        <span class="brand-name">Work Logger</span>
      </div>
    </div>
  </div>

  <nav class="header-nav">
    <a routerLink="/dashboard" routerLinkActive="active" class="nav-link">
      <mat-icon>dashboard</mat-icon>
      <span>Dashboard</span>
    </a>
    <a routerLink="/work-log" routerLinkActive="active" class="nav-link">
      <mat-icon>add_circle</mat-icon>
      <span>Add Log</span>
    </a>
    <a routerLink="/attendance" routerLinkActive="active" class="nav-link">
      <mat-icon>fingerprint</mat-icon>
      <span>Attendance</span>
    </a>
    <a routerLink="/settings" routerLinkActive="active" class="nav-link">
      <mat-icon>settings</mat-icon>
      <span>Settings</span>
    </a>
  </nav>

  <div class="header-right">
    <span class="user-email">{{ userEmail() }}</span>
    <button mat-icon-button class="theme-toggle" (click)="toggleTheme()">
      <mat-icon>{{ isDark() ? 'light_mode' : 'dark_mode' }}</mat-icon>
    </button>
    <button mat-icon-button class="logout-btn" (click)="logout()" matTooltip="Sign out">
      <mat-icon>logout</mat-icon>
    </button>
  </div>
</header>
